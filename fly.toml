app = "linguaverse"
primary_region = "sin"

[build]

[env]
PORT = "8080"

[mounts]
source = "data"
destination = "/data"

[[services]]
internal_port = 8080
protocol = "tcp"

[[services.ports]]
handlers = ["http"]
port = 80

[[services.ports]]
handlers = ["tls", "http"]
port = 443

[[services.http_checks]]
interval = "10s"
timeout = "2s"
grace_period = "5s"
method = "get"
path = "/api/health"